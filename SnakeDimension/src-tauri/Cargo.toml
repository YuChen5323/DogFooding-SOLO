[package]
name = "snake-dimension"
version = "0.1.0"
description = "3D贪吃蛇解谜游戏"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-rc.0", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = { version = "0.8", features = ["std_rng"] }
cgmath = "0.18"
num-traits = "0.2"
dirs = "5.0"

[features]
# this feature is used for production builds or when `devPath` doesn't exist
# so it's the optimal choice for CI builds
custom-protocol = ["tauri/custom-protocol"]
