[package]
name = "image_editor_wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
image = "0.25"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "ImageData",
] }
console_error_panic_hook = "0.1"

[dependencies.js-sys]
version = "0.3"

[profile.release]
opt-level = "s"
lto = true
